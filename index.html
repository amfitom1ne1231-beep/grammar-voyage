    <!-- Something to look at before anything else has been downloaded: the paper in the right colour (the player's own
         choice, else Telegram's scheme, else the system's; the same order as applyTheme in src/lib/util.ts) and a spinner. -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('gv.prefs') || '{}').theme
        var tg = window.Telegram && window.Telegram.WebApp
        var dark = theme === 'dark' || (theme !== 'light' && (tg && tg.initData ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
